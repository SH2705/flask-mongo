{% extends "base.html" %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="h4 mb-3">Submit Data</h1>

          {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
          {% endif %}

          <form method="post" action="/submit" novalidate>
            <div class="mb-3">
              <label class="form-label" for="name">Name</label>
              <input class="form-control" id="name" name="name" type="text" placeholder="Your name" required />
            </div>
            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input class="form-control" id="email" name="email" type="email" placeholder="you@example.com" required />
            </div>
            <div class="mb-3">
              <label class="form-label" for="message">Message (optional)</label>
              <textarea class="form-control" id="message" name="message" rows="3" placeholder="Say something..."></textarea>
            </div>
            <button class="btn btn-primary" type="submit">Submit</button>
          </form>

        </div>
      </div>
    </div>
  </div>
{% endblock %}
